ext {
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.3'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.5'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '14.0.1'
}

configurations.all {
    resolutionStrategy.eachDependency { dependency ->
        if (dependency.requested.group == 'androidx.core' &&
                ['core', 'core-ktx'].contains(dependency.requested.name)) {
            dependency.useVersion androidxCoreVersion
        }
        if (dependency.requested.group == 'androidx.activity' &&
                ['activity', 'activity-ktx'].contains(dependency.requested.name)) {
            dependency.useVersion androidxActivityVersion
        }
    }
}